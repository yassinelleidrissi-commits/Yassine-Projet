<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestion des Abonnements</title>
  <link rel="stylesheet" href="abonnements.css">
</head>
<body>
<header>
  <h1>GYM Management Dashboard</h1>
  <button onclick="logout()">Déconnexion</button>
</header>
<h2>Gestion des Abonnements</h2>

<form id="abonnementForm">
  <input type="hidden" id="id">

  <select id="membre_id" required>
    <option value="">-- Sélectionner un membre --</option>
  </select>

  <select id="type" required>
    <option value="">-- Type d'abonnement --</option>
    <option value="Mensuel">Mensuel</option>
    <option value="Trimestriel">Trimestriel</option>
    <option value="Annuel">Annuel</option>
  </select>

  <input type="number" id="prix" placeholder="Prix" required>
<input type="number" id="duree" placeholder="Durée (mois)" required>

  <button type="submit">Enregistrer</button>
</form>

<table>
  <thead>
    <tr>
      <th>Membre</th>
      <th>Type</th>
      <th>Prix</th>
      <th>Durée</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="abonnementTable"></tbody>
  </table>

<script src="abonnements.js"></script>
</body>
</html>
